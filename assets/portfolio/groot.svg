<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1000" fill="none" role="img" aria-labelledby="title description">
  <title id="title">SO-101 / Policy interface</title>
  <desc id="description">An illustrative engineering drawing of an articulated robot arm. Two camera inputs feed a policy network and a control interface, with a dashed action mapping back to the robot. Not yet GPU-evaluated.</desc>
  <defs>
