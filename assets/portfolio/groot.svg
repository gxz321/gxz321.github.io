    <path d="M80 188h8m-4-4v8M1360 188h-8m4-4v8"/>
  </g>
  <text x="80" y="94" fill="#e0e6db" font-family="Arial, Helvetica, sans-serif" font-size="31" letter-spacing="2.1">SO-101 / POLICY INTERFACE</text>
