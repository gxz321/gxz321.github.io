      <stop stop-color="#3b473e"/><stop offset=".48" stop-color="#303b33"/><stop offset="1" stop-color="#252d29"/>
    </linearGradient>
    <linearGradient id="bearing" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#38443b"/><stop offset="1" stop-color="#252d29"/>
    </linearGradient>
    <clipPath id="work-plane"><path d="M80 164h1280v704H80Z"/></clipPath>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
