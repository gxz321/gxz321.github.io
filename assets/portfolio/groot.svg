    </marker>
    <marker id="action" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="m2 1 6 4-6 4" stroke="#dfff00" stroke-width="1.2" fill="none"/>
