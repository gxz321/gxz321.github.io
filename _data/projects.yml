- name: "👥 CrowdFlow AI — AI-Powered Crowd Planning"
  description: >
    A large-event crowd planning tool built on Social Force Model + LLM.
    Validated with real CCTV data from the 2022 Lyon Festival of Lights (11,904 trajectories).
    Simulates entrance gate designs, diagnoses bottlenecks with AI, and recommends optimizations.
    Core insight: equal-width gates ≠ fair distribution — AI compensates for human behavioral bias through asymmetric design.
